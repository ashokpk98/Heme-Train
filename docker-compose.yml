services:
  postgres:
    image: postgres:16-alpine
    container_name: heme-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: heme
    ports:
      - "5432:5432"
    volumes:
      - heme-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d heme"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  heme-pgdata:
